services:
  vpn:
    build:
      context: .
      # Pin the production stage. Without this, `build: .` picks the LAST stage
      # in the Dockerfile (`test`), which would run the bats suite on a loop
      # instead of the VPN gateway.
      target: base
    container_name: shorti-vpn
    restart: unless-stopped
    # Host networking: tun0, routes, IP forwarding, and the iptables MASQUERADE
    # rules all live in the host namespace — where Mikrotik-routed LAN traffic
    # (sent to the gateway host's IP) actually arrives. Bridge mode would trap the
    # tunnel inside the container and the gateway path would never see that traffic.
    # The health endpoint binds directly on the host's :9798 (a port chosen to
    # stay clear of the common dev-app 8080). Override with HEALTH_PORT in .env.
    network_mode: host
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    # NOTE: net.ipv4.ip_forward is NOT set here. Under host networking Docker
    # refuses to set namespaced net.* sysctls (they'd mutate the host namespace).
    # Enable IP forwarding on the host once instead — see README "Requirements":
    #   echo 'net.ipv4.ip_forward=1' | sudo tee /etc/sysctl.d/99-shorti.conf
    #   sudo sysctl --system
    env_file:
      - .env
    volumes:
      - shorti-logs:/var/log/shorti
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:${HEALTH_PORT:-9798}/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  shorti-logs:
